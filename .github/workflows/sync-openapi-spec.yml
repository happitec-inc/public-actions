name: Sync OpenAPI Spec
run-name: "Sync OpenAPI spec → ${{ inputs.target-repo }}:${{ inputs.target-path }}"

# Reusable workflow for happitec-inc source repos to mirror an OpenAPI spec
# into another repo by opening (or refreshing) a PR whenever the spec changes.
# The target copy is made BYTE-IDENTICAL to the source — no transformation.
#
# Conceptually the OpenAPI analog of bump-tap-formula.yml: the source repo
# calls this on push when its spec changes, and a PR is opened on the target.
#
# Caller usage (in the source repo that owns the spec):
#
#   # .github/workflows/sync-openapi.yml
#   name: Sync OpenAPI Spec
#   on:
#     push:
#       branches: [main]
#       paths: ['openapi/OpenAPI.yaml']   # the spec's path in THIS repo
#   permissions: {}
#   jobs:
#     sync:
#       uses: happitec-inc/public-actions/.github/workflows/sync-openapi-spec.yml@main
#       secrets: inherit
#       with:
#         source-path: openapi/OpenAPI.yaml
#         target-repo: happitec-inc/some-client
#         target-path: Sources/Generated/OpenAPI.yaml
#         # target-base: main   # optional, defaults to main
#
# Required org-level secrets (already used by bump-tap-formula.yml in this
# repo — `secrets: inherit` forwards them):
#   GH_COMPUTER_APP_ID       — happitec-computer App ID
#   GH_COMPUTER_PRIVATE_KEY  — App private key (PEM)
#
# The happitec-computer App must be installed on BOTH:
#   - the caller (source) repo — Contents: Read (to check the spec out), and
#   - the target repo — Contents: Write + Pull requests: Write (to open the PR).
# A brand-new target repo needs that one-time App install before the first sync.
#
# Runner: pinned to ubuntu-latest (GitHub-hosted) on purpose. This workflow
# file lives in a PUBLIC repo, so it must never route a public/fork caller to
# self-hosted Tart infrastructure. The job is a trivial file copy + PR, so a
# hosted runner is the correct, cheapest, and safest choice — it does not take
# a `runner` input.
#
# Behavior:
#   - Idempotent: if the target already byte-matches the source, no PR is opened.
#   - ONE open PR per synced file: the branch is the FIXED
#     sync-openapi/<target-path-slug>, with no commit suffix. It is rebuilt from
#     the target's base HEAD and force-pushed on every sync, so a newer upstream
#     commit UPDATES the existing PR (a PR tracks its head branch) instead of
#     opening a sibling. "Which sync PR is current" is structurally unaskable.
#
#     This replaced a per-commit branch (`…-${SHORT_SHA}`), which opened a new
#     PR per upstream commit. Concurrent open sync PRs for one file all look
#     equally live, and merging the older silently adopts an older contract
#     WITH GREEN CI — green-and-wrong, which is worse than red. Observed in
#     practice: two sync PRs for one file open at once, carrying different
#     contract versions, with nothing to mark either as superseded.

on:
  workflow_call:
    inputs:
      source-path:
        description: 'Path to the source OpenAPI spec within the CALLER repo checkout (e.g. openapi/OpenAPI.yaml).'
        required: true
        type: string
      target-repo:
        description: 'Target repo in owner/name form to receive the synced spec (e.g. happitec-inc/some-client).'
        required: true
        type: string
      target-path:
        description: 'Destination path for the spec within the target repo (e.g. Sources/Generated/OpenAPI.yaml).'
        required: true
        type: string
      target-base:
        description: 'Base branch on the target repo to open the PR against. Default: main.'
        required: false
        default: 'main'
        type: string

permissions: {}

concurrency:
  # One sync per (target-repo, target-path) at a time; serialize re-runs that
  # touch the same destination, but allow independent targets to sync in parallel.
  group: sync-openapi-${{ inputs.target-repo }}-${{ inputs.target-path }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_COMPUTER_APP_ID }}
          private-key: ${{ secrets.GH_COMPUTER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Token is owner-scoped (covers all repos the App is installed on).
          # Audit boundary is the App identity, not the per-token repo scope —
          # consistent with bump-tap-formula.yml.

      - name: Checkout source (caller) repo
        uses: actions/checkout@v6
        with:
          # Use the App token, not the default GITHUB_TOKEN. Callers wire this in
          # with `permissions: {}` (the documented template), which leaves
          # GITHUB_TOKEN with only metadata:read — enough to 404 the checkout of a
          # PRIVATE caller repo ("Repository not found"). The owner-scoped App
          # token reads the source the same way it writes the target; the App is
          # installed on both. This is why the token step runs first.
          token: ${{ steps.app-token.outputs.token }}
          path: source

      - name: Validate source spec + read contract version
        id: contract
        env:
          SOURCE_PATH: ${{ inputs.source-path }}
        run: |
          SRC="source/${SOURCE_PATH}"
          if [ ! -f "$SRC" ]; then
            echo "::error::source-path not found in caller checkout: ${SOURCE_PATH}"
            exit 1
          fi
          # Existence is not enough, and the byte count below was decoration
          # until this check consumed it. A zero-byte source is never a valid
          # OpenAPI document, and it fails in two directions that both look
          # like success:
          #   - against an empty target, `cmp -s` reports IDENTICAL, so the
          #     job announces "already up to date" and opens nothing;
          #   - against a good target, it syncs the emptiness — a PR titled
          #     like any other sync whose content deletes the contract.
          # Both are green-and-wrong. Refuse the input instead of comparing it.
          BYTES=$(wc -c < "$SRC" | tr -d ' ')
          if [ "$BYTES" -eq 0 ]; then
            echo "::error::source spec is empty (0 bytes): ${SOURCE_PATH} — refusing to sync an empty contract"
            exit 1
          fi
          echo "Source spec: $SRC ($BYTES bytes)"

          # The contract version is what makes the single fixed-branch PR
          # self-identifying: with one long-lived PR per file, the title is the
          # only place a reader can see WHICH contract is currently proposed.
          #
          # yq ships preinstalled on the ubuntu-latest runner image.
          VERSION=$(yq '.info.version' "$SRC" 2>/dev/null || true)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            # Fallback scoped twice over. First to the `info:` block: an
            # unscoped grep would also match a `version:` under any other
            # top-level key and report someone else's version as the contract.
            # Then to EXACTLY two spaces of indent, so a nested key one level
            # deeper — `info.license.version` is the realistic one — cannot be
            # mistaken for `info.version` itself.
            VERSION=$(awk '/^info:[[:space:]]*$/ {inside=1; next} inside && /^[^[:space:]#]/ {exit} inside' "$SRC" \
              | grep -m1 -E '^  version:' \
              | sed -E 's/^  version:[[:space:]]*//; s/^["'"'"']//; s/["'"'"']$//' || true)
          fi
          # Deliberately NON-fatal, and this is a considered deviation from the
          # prior art for this fix, which exits 1 here. That version served a
          # single caller; this workflow serves several. An unreadable version is a
          # cosmetic loss (a title without a contract number) — failing the sync
          # over it would turn a malformed `info:` block into a broken sync for
          # every caller,
          # trading the defect being fixed for a worse one.
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::warning::could not read info.version from ${SOURCE_PATH}; PR title will omit the contract version"
            VERSION=""
          else
            echo "Contract version: $VERSION"
          fi
          # Single line only: a multi-line value would break the key=value
          # format and corrupt every later write to this file.
          VERSION=$(printf '%s' "$VERSION" | head -n1 | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.target-repo }}
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.target-base }}
          path: target
          # fetch-depth 0 fetches +refs/heads/*:refs/remotes/origin/*, so the
          # sync branch's remote-tracking ref exists whenever the branch exists
          # remotely — that is what gives --force-with-lease below a real lease
          # to check rather than a vacuous one.
          fetch-depth: 0

      - name: Resolve inputs
        id: vars
        env:
          SOURCE_PATH: ${{ inputs.source-path }}
          TARGET_REPO: ${{ inputs.target-repo }}
          TARGET_PATH: ${{ inputs.target-path }}
          TARGET_BASE: ${{ inputs.target-base }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.contract.outputs.version }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          # Sanitize target-path into a branch-safe slug (each run of non-alnum → '-').
          SLUG=$(printf '%s' "$TARGET_PATH" | tr -c 'A-Za-z0-9' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')
          # FIXED branch per synced file — deliberately NO commit suffix, so a
          # newer source commit updates the one open PR instead of opening a
          # sibling that competes with it.
          BRANCH="sync-openapi/${SLUG}"
          {
            echo "short_sha=$SHORT_SHA"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### OpenAPI spec sync"
            echo ""
            if [ -n "$VERSION" ]; then
              echo "- Source: \`${GITHUB_REPOSITORY}:${SOURCE_PATH}\` @ \`$SHORT_SHA\` (contract \`$VERSION\`)"
            else
              echo "- Source: \`${GITHUB_REPOSITORY}:${SOURCE_PATH}\` @ \`$SHORT_SHA\`"
            fi
            echo "- Target: \`${TARGET_REPO}:${TARGET_PATH}\` (base \`${TARGET_BASE}\`)"
            echo "- Branch: \`$BRANCH\` (fixed; force-pushed)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync file + detect change
        id: sync
        env:
          SOURCE_PATH: ${{ inputs.source-path }}
          TARGET_PATH: ${{ inputs.target-path }}
        run: |
          SRC="source/${SOURCE_PATH}"
          DEST="target/${TARGET_PATH}"
          if [ -f "$DEST" ] && cmp -s "$SRC" "$DEST"; then
            echo "Target already byte-identical to source — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$(dirname "$DEST")"
          cp "$SRC" "$DEST"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Diff to be PR'd:"
          (cd target && git --no-pager diff -- "$TARGET_PATH" | head -200 || true)

      - name: Force-push fixed branch, open or update the single PR
        if: steps.sync.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: ${{ inputs.target-repo }}
          TARGET_PATH: ${{ inputs.target-path }}
          TARGET_BASE: ${{ inputs.target-base }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          VERSION: ${{ steps.contract.outputs.version }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_PATH: ${{ inputs.source-path }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd target || exit 1
          git config user.name  "happitec-computer[bot]"
          git config user.email "232697186+happitec-computer[bot]@users.noreply.github.com"

          # Always rebuild the branch from the CURRENT base HEAD: -B resets an
          # existing branch rather than failing, so the sync commit sits on
          # today's base and never stacks on a stale prior sync. The remote
          # branch is machine-owned; --force-with-lease guards the narrow race
          # with a concurrent writer using the remote-tracking ref as its lease.
          git checkout -B "$BRANCH"
          git add "$TARGET_PATH"
          if [ -n "$VERSION" ]; then
            SUBJECT="Sync OpenAPI spec → ${TARGET_PATH} (${SOURCE_REPO}@${SHORT_SHA}, contract ${VERSION})"
            TITLE="Sync OpenAPI spec: ${TARGET_PATH} (contract ${VERSION}, ${SOURCE_REPO}@${SHORT_SHA})"
            VERSION_LINE="- **Contract version**: \`${VERSION}\`"
          else
            SUBJECT="Sync OpenAPI spec → ${TARGET_PATH} (${SOURCE_REPO}@${SHORT_SHA})"
            TITLE="Sync OpenAPI spec: ${TARGET_PATH} (${SOURCE_REPO}@${SHORT_SHA})"
            VERSION_LINE="- **Contract version**: unreadable from the source spec"
          fi
          git commit -m "$SUBJECT

          Verbatim sync of ${SOURCE_PATH} from ${SOURCE_REPO} at ${SHA}.

          Run: ${RUN_URL}
          "
          git push --force-with-lease origin "$BRANCH"

          # Body written to a file rather than built with a heredoc inside a
          # command substitution. That older shape is unparseable by bash 3.2
          # (the default /bin/bash on macOS), so `bash -n` on this step could not
          # tell a real syntax error from the shell's own limitation — a check
          # that fails on known-good input measures nothing. --body-file parses
          # everywhere, so this step is locally verifiable again.
          BODY_FILE="${RUNNER_TEMP}/sync-openapi-pr-body.md"
          cat > "$BODY_FILE" <<EOF
          ## Summary

          Automated verbatim sync of the OpenAPI spec from \`${SOURCE_REPO}\` into \`${TARGET_PATH}\`. The file in this PR is **byte-identical** to the source.

          ${VERSION_LINE}
          - **Source**: \`${SOURCE_REPO}:${SOURCE_PATH}\` @ \`${SHA}\`
          - **Target**: \`${TARGET_REPO}:${TARGET_PATH}\` (base \`${TARGET_BASE}\`)
          - **Workflow run**: ${RUN_URL}

          This PR rides the FIXED branch \`${BRANCH}\` and is force-push-updated on every upstream spec change, so it is the ONLY open sync PR for this file and always carries the NEWEST contract.

          ## How this happened

          The source repo's \`sync-openapi.yml\` workflow called \`happitec-inc/public-actions/.github/workflows/sync-openapi-spec.yml\` after the spec changed on a push.

          ## Reviewer checklist

          - [ ] The synced spec matches \`${SOURCE_REPO}\` at \`${SHA}\`
          - [ ] No regenerated client / downstream code is needed in this PR (or it is tracked separately)
          EOF

          # Upsert. gh pr create fails when an open PR already exists for the
          # head branch, so check first. On the update path the force-push above
          # has already refreshed the PR's diff; gh pr edit refreshes the title
          # and body, which is what keeps the stated contract version from going
          # stale on a long-lived PR.
          EXISTING=$(gh pr list --repo "$TARGET_REPO" --head "$BRANCH" --state open --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --repo "$TARGET_REPO" \
              --base "$TARGET_BASE" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file "$BODY_FILE"
          else
            gh pr edit "$EXISTING" --repo "$TARGET_REPO" --title "$TITLE" --body-file "$BODY_FILE"
            gh pr comment "$EXISTING" --repo "$TARGET_REPO" --body "Force-push-refreshed to \`${SOURCE_REPO}@${SHORT_SHA}\`. Run: ${RUN_URL}"
            echo "PR #$EXISTING updated in place (branch force-pushed, title/body refreshed)."
          fi

      - name: Summary
        if: always()
        env:
          SKIP: ${{ steps.sync.outputs.skip }}
          TARGET_REPO: ${{ inputs.target-repo }}
          TARGET_PATH: ${{ inputs.target-path }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "Target \`${TARGET_REPO}:${TARGET_PATH}\` already up to date — no PR opened." >> "$GITHUB_STEP_SUMMARY"
          fi
